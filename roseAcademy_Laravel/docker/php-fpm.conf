; PHP-FPM Pool Settings - Optimized for 1 vCPU / 8GB RAM VPS
[www]
user = www-data
group = www-data
listen = 9000

; Static pool to avoid overhead on 1 core
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Timeouts for large video uploads
request_terminate_timeout = 7200
