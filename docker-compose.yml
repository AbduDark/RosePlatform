services:
  frontend:
    build:
      context: ./React-Rose
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./React-Rose:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE: /api
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./roseAcademy_Laravel
      dockerfile: Dockerfile
    volumes:
      - ./roseAcademy_Laravel:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment: &laravel-env
      APP_NAME: Rose Academy
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: rose_academy
      DB_USERNAME: rose
      DB_PASSWORD: rose_password
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  queue:
    build:
      context: ./roseAcademy_Laravel
      dockerfile: Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    volumes:
      - ./roseAcademy_Laravel:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment: *laravel-env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./roseAcademy_Laravel:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rose_academy
      MYSQL_USER: rose
      MYSQL_PASSWORD: rose_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_vendor:
  mysql_data:
  redis_data:
