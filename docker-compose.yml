services:
  api:
    build:
      context: ./roseAcademy_Laravel
      dockerfile: Dockerfile
    volumes:
      - ./roseAcademy_Laravel:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment: &laravel-env
      APP_NAME: "${APP_NAME:-Rose Academy}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://api.rose-academy.com}"
      FRONTEND_URL: "${FRONTEND_URL:-https://rose-academy.com}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-rose-academy.com,www.rose-academy.com}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-.rose-academy.com}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-rose_academy_db}"
      DB_USERNAME: "${DB_USERNAME:-rose_user}"
      DB_PASSWORD: "${DB_PASSWORD:-Rose@SecurePass2026!DB}"
      CACHE_STORE: "${CACHE_STORE:-redis}"
      SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
      REDIS_CLIENT: "${REDIS_CLIENT:-predis}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  queue:
    build:
      context: ./roseAcademy_Laravel
      dockerfile: Dockerfile
    command: php artisan queue:work --queue=default,video-processing --sleep=3 --tries=3 --timeout=7200 --memory=1024
    volumes:
      - ./roseAcademy_Laravel:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment: *laravel-env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-https://api.rose-academy.com/api}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./roseAcademy_Laravel:/var/www/html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://api.rose-academy.com/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-rose_academy_db}"
      MYSQL_USER: "${DB_USERNAME:-rose_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-Rose@SecurePass2026!DB}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-Rose@RootSecure2026!Pass}"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-Rose@RootSecure2026!Pass}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  backend_vendor:
  mysql_data:
  redis_data:
