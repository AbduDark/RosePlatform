# ─── Dynamic origin mapping ───────────────────────────────────────────────────
# Map the incoming Origin header to a variable that Nginx will echo back.
# Only origins listed here will receive CORS headers; everything else gets "".
map $http_origin $cors_origin {
    default                         "";
    "https://rose-academy.com"      "https://rose-academy.com";
    "https://www.rose-academy.com"  "https://www.rose-academy.com";
    "http://localhost:3000"         "http://localhost:3000";
    "http://localhost:5173"         "http://localhost:5173";
    "http://localhost"              "http://localhost";
}

# ─── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    server_name rose-academy.com www.rose-academy.com api.rose-academy.com;
    return 301 https://$host$request_uri;
}

# ─── Frontend (rose-academy.com) ─────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name rose-academy.com www.rose-academy.com;

    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block direct access to video files — all video delivery goes through the API stream endpoint
    location ~* \.(mp4|webm|mov|avi|mkv|flv|wmv|m4v|ogv|ogg)$ {
        deny all;
        return 403;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
    }
}

# ─── API (api.rose-academy.com) ──────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.rose-academy.com;

    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 10240M;

    # Timeouts for large video uploads
    proxy_connect_timeout 7200s;
    proxy_send_timeout    7200s;
    proxy_read_timeout    7200s;
    send_timeout          7200s;

    # ── Main location ────────────────────────────────────────────────────
    location / {
        # Handle CORS preflight (OPTIONS) immediately — never reaches PHP
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-XSRF-TOKEN' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age'           86400 always;
            add_header 'Content-Type'                     'text/plain charset=UTF-8';
            add_header 'Content-Length'                    0;
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP handler ──────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass  api:9000;
        fastcgi_read_timeout    7200;
        fastcgi_send_timeout    7200;
        fastcgi_connect_timeout 7200;
        fastcgi_buffer_size     128k;
        fastcgi_buffers         16 256k;

        # Attach CORS headers to every PHP response
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-XSRF-TOKEN' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age'           86400 always;
        # Re-add HSTS here because add_header in a location block
        # overrides any server-level add_header directives in Nginx
        add_header 'Strict-Transport-Security'        'max-age=31536000; includeSubDomains' always;
    }

    # ── Block dotfiles ───────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── Block direct download of video files from /storage/ ──────────────
    # All video delivery MUST go through /api/lessons/{id}/stream (signed URL)
    location ~* ^/storage/.*\.(mp4|webm|mov|avi|mkv|flv|wmv|m4v|ogv|ogg)$ {
        deny all;
        return 403;
    }

    # ── Internal location for X-Accel-Redirect video streaming ───────────
    # PHP validates the signed URL & auth, then returns X-Accel-Redirect header.
    # Nginx picks it up here and serves the file directly from disk — zero PHP
    # overhead, native Range/206 support, no output buffering issues.
    # The `internal` directive ensures this location is NOT directly accessible
    # from outside (requests from clients will get 404).
    location /protected-videos/ {
        internal;
        alias /var/www/html/storage/app/;
        include /etc/nginx/mime.types;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, max-age=3600" always;
        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Methods'     'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With, Range' always;
        add_header 'Access-Control-Expose-Headers'    'Content-Range, Content-Length, Accept-Ranges, Content-Type' always;
    }
}
